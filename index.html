<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewJeans Remixes</title>
<!--
  IMPORTANT: This file contains a YouTube Data API v3 key.
  Restrict it to your GitHub Pages domain in Google Cloud Console:
  APIs & Services > Credentials > Edit key > Website restrictions
  Add: yourusername.github.io/*
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:  #0c0c0c;
  --bg2: #141414;
  --bg3: #1c1c1c;
  --line: #222;
  --line2: #2a2a2a;
  --text: #e0e0e0;
  --dim:  #666;
  --dimmer: #3a3a3a;
  --r: 10px;
  --r-sm: 6px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Geist', sans-serif; font-size: 14px; overflow: hidden; }

.shell { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 200px; min-width: 200px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: width .25s ease, min-width .25s ease;
  flex-shrink: 0;
}
.sidebar.closed { width: 0; min-width: 0; border-right: none; }

.sb-top { padding: 18px 16px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.sb-title { font-size: 13px; font-weight: 500; white-space: nowrap; }
.sb-sub { font-size: 11px; color: var(--dim); margin-top: 2px; white-space: nowrap; font-family: 'Geist Mono', monospace; }

.sb-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.sb-list::-webkit-scrollbar { width: 2px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--line2); }

.sb-sep { font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--dimmer); padding: 14px 16px 4px; white-space: nowrap; }

.g-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 16px; width: 100%; text-align: left;
  border: none; background: none; font-family: inherit; font-size: 13px;
  color: var(--dim); cursor: pointer; white-space: nowrap;
  transition: color .15s;
}
.g-btn:hover { color: var(--text); }
.g-btn.on { color: var(--text); }
.g-btn .gn { overflow: hidden; text-overflow: ellipsis; }
.g-btn .gc { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--dimmer); flex-shrink: 0; margin-left: 8px; }
.g-btn.on .gc { color: var(--dim); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ── Topbar ── */
.topbar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }

.icon-btn {
  background: none; border: none; cursor: pointer; color: var(--dim);
  border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex-shrink: 0; transition: color .15s;
}
.icon-btn:hover { color: var(--text); }

.page-title { font-size: 13px; font-weight: 400; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }

.search-box {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border: 1px solid var(--line2);
  border-radius: 50px; padding: 0 12px; height: 30px;
  transition: border-color .15s; max-width: 240px; width: 100%;
}
.search-box:focus-within { border-color: #444; }
.search-box svg { flex-shrink: 0; color: var(--dim); }
.search-box input { border: none; background: none; color: var(--text); font-family: inherit; font-size: 12px; outline: none; width: 100%; }
.search-box input::placeholder { color: var(--dimmer); }

.refresh-btn {
  background: none; border: 1px solid var(--line2); color: var(--dim);
  border-radius: var(--r-sm); width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: color .15s, border-color .15s;
}
.refresh-btn:hover { color: var(--text); border-color: #444; }
.refresh-btn.spin svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Sort bar ── */
.sortbar {
  display: flex; align-items: center; gap: 4px;
  padding: 0 16px; height: 38px; border-bottom: 1px solid var(--line);
  flex-shrink: 0; overflow-x: auto;
}
.sortbar::-webkit-scrollbar { display: none; }
.s-btn {
  background: none; border: 1px solid transparent;
  border-radius: 50px; padding: 3px 11px;
  font-family: inherit; font-size: 12px; color: var(--dim);
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.s-btn:hover { color: var(--text); border-color: var(--line2); }
.s-btn.on { color: var(--text); border-color: #3a3a3a; }
.s-div { width: 1px; height: 12px; background: var(--line2); flex-shrink: 0; margin: 0 2px; }
.res-ct { margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--dimmer); white-space: nowrap; }

/* ── Content ── */
.content { flex: 1; overflow-y: auto; padding: 14px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

/* ── Card ── */
.card {
  display: block; text-decoration: none; color: inherit;
  border-radius: var(--r); overflow: hidden; background: var(--bg2);
  transition: background .15s;
  animation: up .22s ease both;
}
.card:hover { background: var(--bg3); }
@keyframes up { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

.card-thumb { position: relative; aspect-ratio: 16/9; background: var(--bg3); overflow: hidden; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
.card:hover .card-thumb img { opacity: .8; }

.card-dur {
  position: absolute; bottom: 5px; right: 5px;
  background: rgba(0,0,0,.8); color: #bbb;
  font-family: 'Geist Mono', monospace; font-size: 10px;
  padding: 1px 5px; border-radius: 4px;
}
.card-gtag {
  position: absolute; top: 5px; left: 5px;
  background: rgba(0,0,0,.75); color: var(--dim);
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  text-transform: uppercase; font-family: 'Geist Mono', monospace; letter-spacing: .03em;
}

.card-body { padding: 9px 11px 11px; }
.card-title {
  font-size: 13px; line-height: 1.45; color: var(--text); margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
.card-ch { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
.card-dot { color: var(--dimmer); }
.card-vw { margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--dimmer); white-space: nowrap; }

/* ── Skeleton ── */
.skel { border-radius: var(--r); overflow: hidden; background: var(--bg2); animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
.skel-thumb { aspect-ratio: 16/9; background: var(--bg3); }
.skel-body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 7px; }
.skel-ln { height: 10px; border-radius: 3px; background: var(--bg3); }

/* ── State ── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; gap: 7px; }
.empty-t { font-size: 14px; color: var(--text); }
.empty-s { font-size: 12px; color: var(--dim); max-width: 260px; text-align: center; line-height: 1.6; }

/* ── Status bar ── */
.statusbar { padding: 5px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dimmer); font-family: 'Geist Mono', monospace; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.s-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dimmer); flex-shrink: 0; }
.s-dot.green { background: #4ade80; }
.s-dot.yellow { background: #facc15; }
.s-dot.red { background: #f87171; }

@media (max-width: 560px) {
  .sidebar { position: absolute; height: 100%; z-index: 20; background: var(--bg); }
  .sidebar.closed { width: 0; }
  .grid { grid-template-columns: 1fr; }
  .page-title { display: none; }
}
</style>
</head>
<body>
<div class="shell">

  <nav class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-title">NewJeans Remixes</div>
      <div class="sb-sub">fan remix library</div>
    </div>
    <div class="sb-list" id="sbList"></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title" id="pageTitle">All</div>
      <div class="search-box">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="Search..." oninput="onSearch()" />
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll(true)" title="Refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
    </header>

    <div class="sortbar">
      <button class="s-btn on" onclick="setSort('relevance',this)">Relevance</button>
      <button class="s-btn" onclick="setSort('date_desc',this)">Latest</button>
      <button class="s-btn" onclick="setSort('date_asc',this)">Oldest</button>
      <button class="s-btn" onclick="setSort('views',this)">Popular</button>
      <div class="s-div"></div>
      <button class="s-btn" onclick="setSort('views_asc',this)">Least viewed</button>
      <span class="res-ct" id="resCt"></span>
    </div>

    <div class="content" id="content"></div>
    <div class="statusbar"><div class="s-dot" id="sDot"></div><span id="sTxt">Loading...</span></div>
  </div>
</div>

<script>
// ── API KEY ──
// Restrict this key in Google Cloud Console to: yourusername.github.io/*
const API_KEY = 'AIzaSyCbHvrXZchnpfCHmd1gQttRowQbda88Vos';

// ── GENRES — most specific first ──
const GENRES = [
  { id:'city-pop',     label:'City Pop',       kw:['city pop','citypop'] },
  { id:'bedroom-pop',  label:'Bedroom Pop',    kw:['bedroom pop','bedroomwave','bedroom wave'] },
  { id:'hyperpop',     label:'Hyperpop',       kw:['hyperpop','digicore','glitchcore','bubblegum bass'] },
  { id:'bubblegum-pop',label:'Bubblegum Pop',  kw:['bubblegum pop'] },
  { id:'indie-pop',    label:'Indie Pop',      kw:['indie pop','indie-pop','indietronica'] },
  { id:'k-pop',        label:'K-Pop',          kw:['kpop','k-pop','k pop edit','k pop remix'] },
  { id:'lo-fi',        label:'Lo-Fi',          kw:['lofi','lo-fi','lo fi','chillhop','study beat','study mix'] },
  { id:'chillout',     label:'Chillout',       kw:['chillout','chill out','downtempo'] },
  { id:'phonk',        label:'Phonk',          kw:['phonk'] },
  { id:'future-bass',  label:'Future Bass',    kw:['future bass'] },
  { id:'deep-house',   label:'Deep House',     kw:['deep house'] },
  { id:'tech-house',   label:'Tech House',     kw:['tech house','tech-house'] },
  { id:'future-house', label:'Future House',   kw:['future house'] },
  { id:'house',        label:'House',          kw:['house music','house remix','house edit','house mix',' house '] },
  { id:'techno',       label:'Techno',         kw:['techno'] },
  { id:'trance',       label:'Trance',         kw:['trance','psytrance','psy trance'] },
  { id:'dnb',          label:'Drum & Bass',    kw:['drum and bass','drum & bass','dnb','d&b','jungle'] },
  { id:'dubstep',      label:'Dubstep',        kw:['dubstep','riddim','brostep'] },
  { id:'garage',       label:'UK Garage',      kw:['uk garage','2step','2-step','garage remix','garage edit'] },
  { id:'jersey',       label:'Jersey Club',    kw:['jersey club','jersey flip','jersey edit'] },
  { id:'edm',          label:'EDM',            kw:['edm','electro house','big room','festival edit'] },
  { id:'electronic',   label:'Electronic',     kw:['electronic remix','electronic edit','electronica'] },
  { id:'synthwave',    label:'Synthwave',      kw:['synthwave','retrowave','outrun','darksynth'] },
  { id:'vaporwave',    label:'Vaporwave',      kw:['vaporwave','vaportrap','future funk'] },
  { id:'ambient',      label:'Ambient',        kw:['ambient','atmospheric','soundscape'] },
  { id:'neo-soul',     label:'Neo Soul',       kw:['neo soul','neo-soul','neosoul'] },
  { id:'r&b',          label:'R&B',            kw:['r&b','rnb','rhythm and blues'] },
  { id:'soul',         label:'Soul',           kw:['soul remix','soul edit','soul flip'] },
  { id:'jazz',         label:'Jazz',           kw:['jazz','bossa nova','bossanova','swing','bebop'] },
  { id:'funk',         label:'Funk',           kw:['funk remix','funk edit','funky remix'] },
  { id:'disco',        label:'Disco',          kw:['disco remix','disco edit','disco flip'] },
  { id:'afrobeats',    label:'Afrobeats',      kw:['afrobeats','afro pop','afrobeat'] },
  { id:'latin',        label:'Latin',          kw:['latin remix','reggaeton','cumbia','dembow'] },
  { id:'reggae',       label:'Reggae',         kw:['reggae','dancehall'] },
  { id:'trap',         label:'Trap',           kw:['trap remix','trap edit','trap flip','trap mix',' trap '] },
  { id:'drill',        label:'Drill',          kw:['drill remix','drill edit','uk drill'] },
  { id:'hip-hop',      label:'Hip-Hop',        kw:['hip hop remix','hip-hop remix','hiphop remix','hip hop edit','rap remix','rap edit','rap flip'] },
  { id:'club',         label:'Club',           kw:['club remix','club mix','club banger','club edit'] },
  { id:'acoustic',     label:'Acoustic',       kw:['acoustic','guitar remix','guitar cover','piano remix','piano ver','piano edit','piano cover'] },
  { id:'orchestral',   label:'Orchestral',     kw:['orchestral','orchestra','cinematic remix','strings remix'] },
  { id:'pop',          label:'Pop',            kw:['pop remix','pop edit','pop mix','pop flip'] },
  { id:'misc',         label:'Misc',           kw:[] },
];

const OFFICIAL = ['newjeans','ador','hybe labels','bunnies camp','hybe','weverse music','big hit'];
const REMIX_WORDS = ['remix','flip','edit','rework','refix','mashup','cover','mix'];

// ── STATE ──
let all = [];
let genre = 'all';
let sort  = 'relevance';
let q = '';
let sbOpen = localStorage.getItem('sb') !== '0';

// ── SIDEBAR ──
function toggleSidebar() {
  sbOpen = !sbOpen;
  localStorage.setItem('sb', sbOpen ? '1' : '0');
  document.getElementById('sidebar').classList.toggle('closed', !sbOpen);
}

function buildSidebar() {
  const counts = {};
  all.forEach(v => { counts[v.genre] = (counts[v.genre]||0)+1; });
  const el = document.getElementById('sbList');
  el.innerHTML = '';

  el.appendChild(mkRow('all','All',all.length));
  el.appendChild(mkSep('Genres'));

  GENRES.forEach(g => {
    if (g.id === 'misc') return;
    if (counts[g.id] > 0) el.appendChild(mkRow(g.id, g.label, counts[g.id]));
  });
  if (counts['misc'] > 0) {
    el.appendChild(mkSep('Other'));
    el.appendChild(mkRow('misc','Misc',counts['misc']));
  }
  highlightSb();
}

function mkRow(id, label, count) {
  const b = document.createElement('button');
  b.className = 'g-btn';
  b.dataset.id = id;
  b.onclick = () => pickGenre(id, label);
  b.innerHTML = `<span class="gn">${label}</span><span class="gc">${count}</span>`;
  return b;
}
function mkSep(label) {
  const d = document.createElement('div');
  d.className = 'sb-sep';
  d.textContent = label;
  return d;
}
function highlightSb() {
  document.querySelectorAll('.g-btn').forEach(b => b.classList.toggle('on', b.dataset.id === genre));
}
function pickGenre(id, label) {
  genre = id;
  highlightSb();
  document.getElementById('pageTitle').textContent = id === 'all' ? 'All' : label;
  render();
}

// ── GENRE DETECTION ──
function detectGenre(title) {
  const t = ' ' + title.toLowerCase() + ' ';
  for (const g of GENRES) {
    if (g.id === 'misc') continue;
    if (g.kw.some(k => t.includes(k))) return g.id;
  }
  return 'misc';
}
function genreLabel(id) {
  return GENRES.find(g => g.id === id)?.label || id;
}

// ── QUERIES — cast a wide net ──
const QUERIES = [
  // General
  'newjeans remix','newjeans edit','newjeans flip','newjeans rework','newjeans cover remix','newjeans mashup',
  '"new jeans" remix',
  // Songs
  'hype boy newjeans remix','ditto newjeans remix','omg newjeans remix','super shy remix newjeans',
  'eta newjeans remix','cookie newjeans remix','attention newjeans remix',
  'newjeans bubble gum remix','newjeans right now remix','newjeans how sweet remix',
  'newjeans supernatural remix','newjeans hurt remix','newjeans asap remix',
  'newjeans cool with you remix','newjeans zero remix',
  // Genres
  'newjeans lo-fi','newjeans lofi remix','newjeans house remix','newjeans phonk',
  'newjeans trap remix','newjeans rnb remix','newjeans r&b remix',
  'newjeans jazz remix','newjeans synthwave remix','newjeans hyperpop',
  'newjeans drum and bass','newjeans dnb remix','newjeans city pop remix',
  'newjeans future bass remix','newjeans deep house remix','newjeans ambient remix',
  'newjeans drill remix','newjeans hip hop remix','newjeans vaporwave',
  'newjeans acoustic remix','newjeans piano remix','newjeans edm remix',
  'newjeans techno remix','newjeans indie pop remix','newjeans bedroom pop remix',
  'newjeans uk garage remix','newjeans jersey club remix','newjeans neo soul remix',
  'newjeans disco remix','newjeans funk remix',
];

function isRemix(item) {
  const title = (item.snippet?.title||'').toLowerCase();
  const ch    = (item.snippet?.channelTitle||'').toLowerCase();
  if (OFFICIAL.some(o => ch.includes(o))) return false;
  if (!REMIX_WORDS.some(w => title.includes(w))) return false;
  if (!title.includes('newjeans') && !title.includes('new jeans')) return false;
  return true;
}

async function ytSearch(query, order) {
  const p = new URLSearchParams({ part:'snippet', q:query, type:'video', maxResults:'50', order, key:API_KEY });
  const r = await fetch('https://www.googleapis.com/youtube/v3/search?' + p);
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message||'API error'); }
  return r.json();
}

async function ytDetails(ids) {
  if (!ids.length) return {};
  const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids.join(',')}&key=${API_KEY}`);
  const d = await r.json();
  const m = {};
  (d.items||[]).forEach(v => { m[v.id] = { dur: parseDur(v.contentDetails?.duration), views: +v.statistics?.viewCount||0 }; });
  return m;
}

function parseDur(iso) {
  if (!iso) return '';
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h=+m[1]||0, mn=+m[2]||0, s=+m[3]||0;
  return h ? `${h}:${p2(mn)}:${p2(s)}` : `${mn}:${p2(s)}`;
}
function p2(n) { return String(n).padStart(2,'0'); }

async function loadAll(force=false) {
  if (!force) {
    try {
      const c = JSON.parse(localStorage.getItem('nj_v2')||'null');
      if (c && Date.now()-c.ts < 7200000) {
        all = c.data;
        buildSidebar();
        render();
        setStatus('green', `${all.length} remixes (cached)`);
        return;
      }
    } catch(_) {}
  }

  setStatus('yellow','Searching YouTube...');
  document.getElementById('refreshBtn').classList.add('spin');
  showSkel();

  const seen = new Set();
  const raw  = [];

  try {
    // Run queries in batches of 8 concurrently
    for (let i = 0; i < QUERIES.length; i += 8) {
      const batch = QUERIES.slice(i, i+8);
      const results = await Promise.allSettled(batch.map(q => ytSearch(q, 'relevance')));
      results.forEach(res => {
        if (res.status !== 'fulfilled') return;
        (res.value.items||[]).forEach(item => {
          const id = item.id?.videoId;
          if (!id || seen.has(id) || !isRemix(item)) return;
          seen.add(id);
          raw.push(item);
        });
      });
      setStatus('yellow', `Found ${raw.length}...`);
    }

    // Fetch details in batches of 50
    const details = {};
    const ids = raw.map(i => i.id.videoId);
    for (let i = 0; i < ids.length; i += 50) {
      Object.assign(details, await ytDetails(ids.slice(i, i+50)));
    }

    all = raw.map(item => {
      const id = item.id.videoId;
      return {
        id,
        title:     item.snippet.title,
        channel:   item.snippet.channelTitle,
        thumb:     item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || '',
        published: item.snippet.publishedAt,
        genre:     detectGenre(item.snippet.title),
        dur:       details[id]?.dur  || '',
        views:     details[id]?.views || 0,
      };
    });

    localStorage.setItem('nj_v2', JSON.stringify({ ts: Date.now(), data: all }));
    buildSidebar();
    render();
    setStatus('green', `${all.length} remixes loaded`);
  } catch(e) {
    console.error(e);
    try {
      const c = JSON.parse(localStorage.getItem('nj_v2')||'null');
      if (c) { all = c.data; buildSidebar(); render(); setStatus('red', `Error — showing cached data`); return; }
    } catch(_) {}
    setStatus('red', 'Error: ' + e.message);
    document.getElementById('content').innerHTML =
      `<div class="empty"><div class="empty-t">Could not load remixes</div><div class="empty-s">${esc(e.message)}</div></div>`;
  } finally {
    document.getElementById('refreshBtn').classList.remove('spin');
  }
}

// ── SORT & FILTER ──
function setSort(s, btn) {
  sort = s;
  document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function onSearch() { q = document.getElementById('searchInput').value; render(); }

function getFiltered() {
  let list = [...all];
  if (genre !== 'all') list = list.filter(v => v.genre === genre);
  if (q) { const lq = q.toLowerCase(); list = list.filter(v => v.title.toLowerCase().includes(lq) || v.channel.toLowerCase().includes(lq)); }
  if (sort === 'date_desc') list.sort((a,b) => new Date(b.published)-new Date(a.published));
  else if (sort === 'date_asc') list.sort((a,b) => new Date(a.published)-new Date(b.published));
  else if (sort === 'views') list.sort((a,b) => b.views-a.views);
  else if (sort === 'views_asc') list.sort((a,b) => a.views-b.views);
  return list;
}

// ── RENDER ──
function render() {
  const list = getFiltered();
  document.getElementById('resCt').textContent = `${list.length} video${list.length!==1?'s':''}`;
  const el = document.getElementById('content');

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-t">No remixes found</div><div class="empty-s">Try a different genre or search term.</div></div>`;
    return;
  }

  el.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';
  list.forEach((v, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `https://www.youtube.com/watch?v=${v.id}`;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.animationDelay = `${Math.min(i*25,300)}ms`;
    a.innerHTML = `
      <div class="card-thumb">
        <img src="${esc(v.thumb)}" alt="" loading="lazy" />
        <div class="card-gtag">${esc(genreLabel(v.genre))}</div>
        ${v.dur ? `<div class="card-dur">${esc(v.dur)}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(v.title)}</div>
        <div class="card-meta">
          <span class="card-ch">${esc(v.channel)}</span>
          <span class="card-dot">·</span>
          <span>${ago(v.published)}</span>
          ${v.views ? `<span class="card-vw">${fmtV(v.views)}</span>` : ''}
        </div>
      </div>`;
    grid.appendChild(a);
  });
  el.appendChild(grid);
}

function showSkel() {
  document.getElementById('content').innerHTML =
    '<div class="grid">' +
    Array.from({length:20}, () =>
      `<div class="skel"><div class="skel-thumb"></div><div class="skel-body">
       <div class="skel-ln" style="width:82%"></div>
       <div class="skel-ln" style="width:62%"></div>
       <div class="skel-ln" style="width:42%"></div>
       </div></div>`).join('') +
    '</div>';
}

function setStatus(color, msg) {
  document.getElementById('sDot').className = `s-dot ${color}`;
  document.getElementById('sTxt').textContent = msg;
}

// ── UTILS ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtV(n) { return n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n); }
function ago(iso) {
  if (!iso) return '';
  const d = (Date.now()-new Date(iso))/1000;
  if (d<3600) return Math.floor(d/60)+'m ago';
  if (d<86400) return Math.floor(d/3600)+'h ago';
  if (d<2592000) return Math.floor(d/86400)+'d ago';
  if (d<31536000) return Math.floor(d/2592000)+'mo ago';
  return Math.floor(d/31536000)+'y ago';
}

// ── INIT ──
if (!sbOpen) document.getElementById('sidebar').classList.add('closed');
loadAll();
</script>
